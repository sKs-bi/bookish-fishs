version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: asset-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: asset_management
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - asset-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: asset-backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: asset_management
      JWT_SECRET: xcgl_asset_management_jwt_secret_key_2024
      JWT_EXPIRES_IN: 7d
      BACKUP_PATH: ./backups
      UPLOAD_PATH: ./uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - asset-network
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: asset-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - asset-network
    restart: unless-stopped

networks:
  asset-network:
    driver: bridge

volumes:
  mysql_data:
  uploads_data:
  backups_data:
